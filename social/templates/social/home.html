<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Social API</title>
    <style>
      :root { color: #1d2028; background: #eef2f7; font-family: Georgia, serif; }
      body { margin: 0; }
      main { max-width: 760px; margin: 0 auto; padding: 32px 20px 56px; }
      h1 { margin: 0 0 4px; color: #0a6e8a; }
      h2 { font-size: 20px; margin: 0 0 12px; }
      p { line-height: 1.5; }
      section { background: #fff; border: 1px solid #c9d3df; border-radius: 6px; margin: 18px 0; padding: 20px; }
      form { display: grid; gap: 10px; }
      input, textarea, button { font: inherit; padding: 10px; border-radius: 4px; }
      input, textarea { border: 1px solid #9aa9b8; }
      textarea { min-height: 76px; resize: vertical; }
      button { background: #0a6e8a; border: 0; color: #fff; cursor: pointer; }
      button:hover { background: #07576e; }
      .row { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .post { border-top: 1px solid #d7dfe8; padding: 14px 0; }
      .post:first-child { border-top: 0; }
      .muted { color: #5f6c7b; }
      #status { min-height: 24px; font-weight: bold; }
      @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Social API</h1>
      <p class="muted">Uma rede social simples construída com Django REST Framework.</p>
      <p id="status" aria-live="polite"></p>

      <section id="auth-section">
        <div class="row">
          <form id="register-form">
            <h2>Criar conta</h2>
            <input name="username" placeholder="Usuário" required>
            <input name="password" type="password" placeholder="Senha (mínimo 8 caracteres)" required>
            <button>Cadastrar</button>
          </form>
          <form id="login-form">
            <h2>Entrar</h2>
            <input name="username" placeholder="Usuário" required>
            <input name="password" type="password" placeholder="Senha" required>
            <button>Entrar</button>
          </form>
        </div>
      </section>

      <section id="profile-section" hidden>
        <h2>Meu perfil</h2>
        <form id="profile-form">
          <input name="first_name" placeholder="Nome">
          <input name="last_name" placeholder="Sobrenome">
          <input name="password" type="password" placeholder="Nova senha">
          <input name="avatar" type="file" accept="image/*">
          <input name="avatar_url" type="url" placeholder="URL da foto de perfil">
          <button>Atualizar perfil</button>
        </form>
      </section>

      <section id="people-section" hidden>
        <h2>Pessoas</h2>
        <button id="refresh-people">Encontrar perfis</button>
        <button id="show-following">Seguindo</button>
        <button id="show-followers">Seguidores</button>
        <div id="connections"></div>
        <div id="people"></div>
      </section>

      <section id="post-section" hidden>
        <h2>Nova postagem</h2>
        <form id="post-form">
          <textarea name="content" maxlength="280" placeholder="No que você está pensando?" required></textarea>
          <button>Publicar</button>
        </form>
      </section>

      <section id="feed-section" hidden>
        <h2>Meu feed</h2>
        <button id="refresh-feed">Atualizar feed</button>
        <div id="feed"><p class="muted">Siga outros perfis pela API para ver suas postagens aqui.</p></div>
      </section>
    </main>
    <script>
      const api = '/api/social/';
      const status = document.querySelector('#status');
      const token = () => localStorage.getItem('social-token');
      const headers = () => ({ 'Content-Type': 'application/json', Authorization: `Token ${token()}` });

      function showAuthenticatedSections() {
        document.querySelector('#auth-section').hidden = Boolean(token());
        document.querySelector('#profile-section').hidden = !token();
        document.querySelector('#people-section').hidden = !token();
        document.querySelector('#post-section').hidden = !token();
        document.querySelector('#feed-section').hidden = !token();
        if (token()) loadProfile();
      }

      async function request(path, options = {}) {
        const response = await fetch(api + path, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.detail || JSON.stringify(data));
        return data;
      }

      async function authenticate(form, endpoint) {
        const data = Object.fromEntries(new FormData(form));
        const response = await request(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        localStorage.setItem('social-token', response.token);
        status.textContent = 'Autenticação realizada.';
        showAuthenticatedSections();
      }

      async function loadProfile() {
        const profile = await request('profiles/me/', { headers: headers() });
        window.myProfileId = profile.id;
        for (const [name, value] of Object.entries(profile)) {
          const field = document.querySelector(`#profile-form [name="${name}"]`);
          if (field) field.value = value || '';
        }
        loadFeed();
        loadPeople();
      }

      function escapeHtml(value) {
        const element = document.createElement('div');
        element.textContent = value;
        return element.innerHTML;
      }

      async function loadFeed() {
        const feed = await request('posts/feed/', { headers: headers() });
        const container = document.querySelector('#feed');
        container.innerHTML = feed.results.length
          ? feed.results.map(post => `<article class="post"><strong>@${escapeHtml(post.author)}</strong><p>${escapeHtml(post.content)}</p><small>${post.likes_count} curtidas · ${post.comments.length} comentários</small><p><button data-like="${post.id}">Curtir</button></p><form data-comment="${post.id}"><input name="content" maxlength="280" placeholder="Escreva um comentário" required><button>Comentar</button></form></article>`).join('')
          : '<p class="muted">Ainda não há postagens de pessoas que você segue.</p>';
      }

      async function loadPeople() {
        const response = await request('profiles/', { headers: headers() });
        const people = response.results.filter(profile => profile.id !== window.myProfileId);
        document.querySelector('#people').innerHTML = people.map(profile => `<article class="post"><strong>@${escapeHtml(profile.username)}</strong><p>${profile.followers_count} seguidores · ${profile.following_count} seguindo</p><button data-follow="${profile.id}">Seguir</button></article>`).join('') || '<p class="muted">Não há outros perfis.</p>';
      }

      async function loadConnections(kind) {
        const profiles = await request(`profiles/${window.myProfileId}/${kind}/`, { headers: headers() });
        document.querySelector('#connections').innerHTML = `<p><strong>${kind === 'followers' ? 'Seguidores' : 'Seguindo'}:</strong> ${profiles.length ? profiles.map(profile => `@${escapeHtml(profile.username)}`).join(', ') : 'nenhum'}</p>`;
      }

      document.querySelector('#register-form').addEventListener('submit', async event => { event.preventDefault(); try { await authenticate(event.target, 'auth/register/'); } catch (error) { status.textContent = error.message; } });
      document.querySelector('#login-form').addEventListener('submit', async event => { event.preventDefault(); try { await authenticate(event.target, 'auth/login/'); } catch (error) { status.textContent = error.message; } });
      document.querySelector('#profile-form').addEventListener('submit', async event => { event.preventDefault(); try { const formData = new FormData(event.target); if (!formData.get('avatar').size) formData.delete('avatar'); const response = await fetch(api + 'profiles/me/', { method: 'PATCH', headers: { Authorization: `Token ${token()}` }, body: formData }); if (!response.ok) throw new Error(await response.text()); status.textContent = 'Perfil atualizado.'; } catch (error) { status.textContent = error.message; } });
      document.querySelector('#post-form').addEventListener('submit', async event => { event.preventDefault(); try { await request('posts/', { method: 'POST', headers: headers(), body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); event.target.reset(); status.textContent = 'Postagem publicada.'; loadFeed(); } catch (error) { status.textContent = error.message; } });
      document.querySelector('#refresh-feed').addEventListener('click', () => loadFeed().catch(error => status.textContent = error.message));
      document.querySelector('#refresh-people').addEventListener('click', () => loadPeople().catch(error => status.textContent = error.message));
      document.querySelector('#show-following').addEventListener('click', () => loadConnections('following').catch(error => status.textContent = error.message));
      document.querySelector('#show-followers').addEventListener('click', () => loadConnections('followers').catch(error => status.textContent = error.message));
      document.querySelector('#people').addEventListener('click', async event => { if (!event.target.dataset.follow) return; try { await request(`profiles/${event.target.dataset.follow}/follow/`, { method: 'POST', headers: headers() }); status.textContent = 'Perfil seguido.'; loadPeople(); loadFeed(); } catch (error) { status.textContent = error.message; } });
      document.querySelector('#feed').addEventListener('click', async event => { if (!event.target.dataset.like) return; try { await request(`posts/${event.target.dataset.like}/like/`, { method: 'POST', headers: headers() }); loadFeed(); } catch (error) { status.textContent = error.message; } });
      document.querySelector('#feed').addEventListener('submit', async event => { if (!event.target.dataset.comment) return; event.preventDefault(); try { await request(`posts/${event.target.dataset.comment}/comments/`, { method: 'POST', headers: headers(), body: JSON.stringify(Object.fromEntries(new FormData(event.target))) }); event.target.reset(); loadFeed(); } catch (error) { status.textContent = error.message; } });
      showAuthenticatedSections();
    </script>
  </body>
</html>
