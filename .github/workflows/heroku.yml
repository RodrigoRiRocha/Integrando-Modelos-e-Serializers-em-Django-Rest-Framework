name: CI and Heroku deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: 'True'
      SECRET_KEY: ci-only-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run tests
        run: python manage.py test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Heroku CLI
        run: npm install --global heroku
      - name: Select the container stack
        run: heroku stack:set container --app "$HEROKU_APP_NAME"
      - name: Connect Heroku Git remote
        run: heroku git:remote --app "$HEROKU_APP_NAME"
      - name: Deploy main to Heroku
        run: git push heroku HEAD:main